
name: Sync s3_releases

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-s3-releases
  cancel-in-progress: false

jobs:
  sync:
    name: Update master from gorgone/s3_releases
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/gorgone/s3_releases.git
          git fetch upstream
          git fetch origin master

          if ! git show-ref --verify --quiet refs/remotes/upstream/master; then
            echo "::error::The upstream repository has no master branch."
            echo "Available upstream branches:"
            git branch -r
            exit 1
          fi

      - name: Synchronize and preserve workflows
        shell: bash
        run: |
          set -euo pipefail

          git checkout master

          BACKUP_DIR="$(mktemp -d)"
          trap 'rm -rf "$BACKUP_DIR"' EXIT

          if [ -d .github/workflows ]; then
            cp -a .github/workflows "$BACKUP_DIR/workflows"
          fi

          UPSTREAM_COMMIT="$(git rev-parse upstream/master)"

          # Match the repository contents to the upstream.
          git reset --hard upstream/master

          # Restore this repository's GitHub Actions workflows.
          if [ -d "$BACKUP_DIR/workflows" ]; then
            mkdir -p .github/workflows
            cp -a "$BACKUP_DIR/workflows/." .github/workflows/
          fi

          git add -A -- .github/workflows

          if ! git diff --cached --quiet; then
            git commit -m "Preserve GitHub Actions workflows"
          fi

          echo "UPSTREAM_COMMIT=$UPSTREAM_COMMIT" >> "$GITHUB_ENV"
          echo "Upstream commit: $UPSTREAM_COMMIT"
          echo "Local commit: $(git rev-parse HEAD)"

      - name: Push updates to GitHub
        shell: bash
        run: |
          set -euo pipefail
          git push --force-with-lease origin master

      - name: Verify synchronization
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin master

          # Check that files outside the workflow directory match upstream.
          git diff --exit-code \
            "$UPSTREAM_COMMIT" origin/master \
            -- . ':(exclude).github/workflows/**'

          # Verify that the workflow directory exists in the pushed branch.
          git cat-file -e origin/master:.github/workflows

          echo "Synchronization verified successfully."

      - name: Create issue on synchronization failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          TITLE="[s3_releases Sync] Upstream synchronization failed"

          BODY=$(cat <<EOF
          Die automatische Synchronisierung von gorgone/s3_releases ist fehlgeschlagen.

          **Upstream:** https://github.com/gorgone/s3_releases
          **Ziel-Repository:** https://github.com/${GH_REPO}
          **Branch:** master

          Bitte prüfe die Workflow-Protokolle:
          ${RUN_URL}
          EOF
          )

          gh label create sync-error \
            --repo "$GH_REPO" \
            --color "d73a4a" \
            --description "Automatic synchronization errors" \
            2>/dev/null || true

          EXISTING_ISSUE="$(gh issue list \
            --repo "$GH_REPO" \
            --state open \
            --label sync-error \
            --json number,title \
            --jq '.[] | select(.title == "[s3_releases Sync] Upstream synchronization failed") | .number' \
            | head -n 1)"

          if [ -n "$EXISTING_ISSUE" ]; then
            gh issue comment "$EXISTING_ISSUE" \
              --repo "$GH_REPO" \
              --body "$BODY"
          else
            gh issue create \
              --repo "$GH_REPO" \
              --title "$TITLE" \
              --label sync-error \
              --body "$BODY"
          fi
